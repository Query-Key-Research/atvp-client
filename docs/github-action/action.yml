name: 'Record ATVP Fix Result'
description: 'Record the outcome of a fix application to the QueryKey Cases ATVP ledger'
author: 'QueryKey'
branding:
  icon: check-circle
  color: green

inputs:
  api_key:
    description: 'QueryKey API key'
    required: true
  intent_id:
    description: 'The ATVP download intent ID created when the case was downloaded for application'
    required: true
  outcome:
    description: 'Outcome of the fix application: confirm (worked), refute (failed), derive (needed changes), or rollback (had to revert)'
    required: true
    default: 'confirm'
  notes:
    description: 'Optional human-readable notes about the outcome'
    required: false
    default: ''
  querykey_base_url:
    description: 'QueryKey API base URL'
    required: false
    default: 'https://www.querykey.com'

runs:
  using: 'node20'
  main: 'entrypoint.mjs'
